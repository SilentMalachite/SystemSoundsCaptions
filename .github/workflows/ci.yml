name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # unit tests, plus loading the real libvosk through FFM on each OS
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Check class file versions
        shell: bash
        run: |
          mkdir -p target/check && cd target/check
          unzip -q -o ../SystemSoundsCaptions.jar captions/Launcher.class captions/App.class
          launcher=$(javap -v captions/Launcher.class | grep 'major version')
          app=$(javap -v captions/App.class | grep 'major version')
          echo "Launcher: $launcher"; echo "App: $app"
          [[ "$launcher" == *": 52" ]] || { echo "::error::Launcher must target Java 8"; exit 1; }
          [[ "$app" == *": 69" ]] || { echo "::error::App must target Java 25"; exit 1; }

      - name: Upload jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: SystemSoundsCaptions-jar
          path: target/SystemSoundsCaptions.jar
          if-no-files-found: error

  old-java:
    name: Launcher on Java 8 shows the version error
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SystemSoundsCaptions-jar

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Run the jar on Java 8
        shell: bash
        run: |
          set +e
          java -Djava.awt.headless=true -jar SystemSoundsCaptions.jar > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          [[ $code -eq 1 ]] || { echo "::error::expected exit code 1, got $code"; exit 1; }
          grep -q "Java 25" out.txt || { echo "::error::no version message"; exit 1; }
