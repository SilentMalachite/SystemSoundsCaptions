<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Windows, 16-20 px: three bars and two lines on the pixel grid -->
  <rect width="16" height="16" rx="3" fill="#24336A"/>
  <g fill="#5EE3E0">
    <rect x="3" y="4" width="2" height="3"/>
    <rect x="7" y="2" width="2" height="7"/>
    <rect x="11" y="3" width="2" height="5"/>
  </g>
  <rect x="3" y="10" width="10" height="2" fill="#FFFFFF"/>
  <rect x="3" y="13" width="6" height="2" fill="#8B95AD"/>
</svg>
