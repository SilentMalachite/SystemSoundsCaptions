<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Windows, 48 px and up: the tile fills the canvas, no shadow -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31468A"/>
      <stop offset="1" stop-color="#121936"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="170" x2="0" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6EF0DA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <g transform="translate(32 32) scale(0.9375)">
    <rect width="1024" height="1024" rx="160" fill="url(#bg)"/>
    <g fill="url(#wave)">
      <rect x="196" y="285" width="56" height="130" rx="28"/>
      <rect x="292" y="230" width="56" height="240" rx="28"/>
      <rect x="388" y="180" width="56" height="340" rx="28"/>
      <rect x="484" y="225" width="56" height="250" rx="28"/>
      <rect x="580" y="170" width="56" height="360" rx="28"/>
      <rect x="676" y="240" width="56" height="220" rx="28"/>
      <rect x="772" y="290" width="56" height="120" rx="28"/>
    </g>
    <rect x="152" y="600" width="720" height="228" rx="60" fill="#000000" fill-opacity="0.32"/>
    <rect x="216" y="652" width="592" height="48" rx="24" fill="#FFFFFF"/>
    <rect x="216" y="728" width="384" height="48" rx="24" fill="#8B95AD"/>
  </g>
</svg>
