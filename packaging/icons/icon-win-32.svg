  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <g fill="#5EE3E0">
    <rect x="7" y="9" width="2" height="5" rx="1"/>
    <rect x="11" y="6" width="2" height="11" rx="1"/>
    <rect x="15" y="4" width="2" height="15" rx="1"/>
    <rect x="19" y="7" width="2" height="9" rx="1"/>
    <rect x="23" y="9" width="2" height="5" rx="1"/>
  </g>
  <rect x="6" y="21" width="20" height="3" rx="1.5" fill="#FFFFFF"/>
  <rect x="6" y="26" width="12" height="3" rx="1.5" fill="#8B95AD"/>
</svg>
